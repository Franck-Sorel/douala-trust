name: AI Agent — Maintain

# Manual only. Dispatches an opencode agent to perform maintenance on the SDLC artifacts
# (e.g. refresh status / gap / completeness assessments, validate consistency, tidy docs)
# and opens a PR with any changes it makes.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task for the AI agent.
        required: false
        type: string
        default: |
          Perform routine project maintenance: refresh the Current State (gap analysis and completeness assessment) in CLAUDE.md based on the current artifacts, and run a consistency pass over 1-spec/, 2-design/, decisions/, and docs/adr/ (fix obvious index/link inconsistencies). Do not change architecture or scope.
      base_branch:
        description: Base branch for the resulting PR.
        required: false
        default: main
        type: string
      model:
        description: opencode model to use.
        required: false
        default: opencode/big-pickle
        type: string
      auto:
        description: Run non-interactively (--auto).
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-maintain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Setup opencode
        uses: ./.github/actions/setup-opencode

      - name: Create work branch
        run: |
          BRANCH="ai/maintain/${{ github.run_id }}"
          git checkout -b "${BRANCH}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Run AI maintainer
        id: agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/prompt.md <<PROMPT
          Perform maintenance in this repository's working tree. Follow the AI SDLC framework conventions in CLAUDE.md. Keep the change minimal and non-destructive.

          Task:
          ${{ inputs.task }}
          PROMPT
          AUTO=""
          if [ "${{ inputs.auto }}" = "true" ]; then AUTO="--auto"; fi
          set +e
          /home/runner/.opencode/bin/opencode run ${AUTO} \
            --model "${{ inputs.model }}" \
            "$(cat /tmp/prompt.md)"
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit maintenance changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          else
            git commit -q -m "chore: AI maintenance (${{ github.run_id }})

Processed via workflow dispatch.
opencode exit code: ${{ steps.agent.outputs.exit_code }}"
            echo "NO_CHANGES=false" >> "$GITHUB_ENV"
            git push -u origin "ai/maintain/${{ github.run_id }}"
          fi

      - name: Open pull request
        if: env.NO_CHANGES == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "ai/maintain/${{ github.run_id }}" \
            --title "chore: AI maintenance run ${{ github.run_id }}" \
            --body "Automated maintenance PR generated by the **AI Agent — Maintain** workflow." || \
          echo "::notice::PR may already exist for this branch"

      - name: No changes notice
        if: env.NO_CHANGES == 'true'
        run: echo "::notice::The AI maintainer produced no changes to commit."
