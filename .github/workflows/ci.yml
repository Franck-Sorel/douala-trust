name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.workspace }} — typecheck / lint / test / build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, buyer-app]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter "@douala-trust/${{ matrix.workspace }}" typecheck

      - name: Lint
        run: pnpm --filter "@douala-trust/${{ matrix.workspace }}" lint

      - name: Test
        run: pnpm --filter "@douala-trust/${{ matrix.workspace }}" test

      - name: Build
        run: pnpm --filter "@douala-trust/${{ matrix.workspace }}" build

  migrations:
    name: API migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: douala_trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/douala_trust
        run: pnpm --filter "@douala-trust/api" db:migrate
