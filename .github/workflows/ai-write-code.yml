name: AI Agent — Write Code

# Manual only. Dispatches an opencode agent to implement a task directly in the working
# tree, then opens a PR with the changes it made.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the AI agent to implement (raw code, reflects the SDLC artifacts).
        required: true
        type: string
      base_branch:
        description: Base branch for the resulting PR.
        required: false
        default: main
        type: string
      model:
        description: opencode model to use.
        required: false
        default: opencode/big-pickle
        type: string
      auto:
        description: Run non-interactively (--auto).
        required: false
        default: true
        type: boolean
      thinking:
        description: Enable thinking (--thinking).
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Setup opencode
        uses: ./.github/actions/setup-opencode

      - name: Create work branch
        run: |
          BRANCH="ai/write/${{ github.run_id }}"
          git checkout -b "${BRANCH}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Download skills at runtime
        run: |
          # ── code-review-skill — used post-implementation for self-review ───────
          SKILL_DIR="${HOME}/.claude/skills/code-review-skill"
          mkdir -p "${SKILL_DIR}"
          curl -fsSL \
            "https://raw.githubusercontent.com/awesome-skills/code-review-skill/main/SKILL.md" \
            -o "${SKILL_DIR}/SKILL.md"
          echo "::notice::Downloaded code-review-skill/SKILL.md"

          # ── awesome-code-review-prompts — agent uses these for self-QA ─────────
          PROMPTS_DIR="${HOME}/.claude/skills/awesome-review-prompts"
          mkdir -p "${PROMPTS_DIR}"
          for file in all-in-one security code-quality; do
            curl -fsSL \
              "https://raw.githubusercontent.com/dcarrero/awesome-code-review-prompts/main/prompts/general/${file}.md" \
              -o "${PROMPTS_DIR}/${file}.md"
            echo "::notice::Downloaded awesome-review-prompts/${file}.md"
          done

          echo "Installed skills:"
          find "${HOME}/.claude/skills" -name "*.md" | sort | sed 's|^|  |'

      - name: Build prompt
        run: |
          # Substitute {{TASK}} placeholder from the versioned template
          TASK="${{ inputs.task }}"
          sed "s|{{TASK}}|${TASK}|g" \
            .github/prompts/implement.md \
            > /tmp/prompt.md
          echo "::notice::Prompt ready ($(wc -l </tmp/prompt.md) lines)"

      - name: Run AI agent (write raw code)
        id: agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          THINK=""
          if [ "${{ inputs.thinking }}" = "true" ]; then THINK="--thinking"; fi
          AUTO=""
          if [ "${{ inputs.auto }}" = "true" ]; then AUTO="--auto"; fi
          set +e
          /home/runner/.opencode/bin/opencode run ${THINK} ${AUTO} \
            --model "${{ inputs.model }}" \
            "$(cat /tmp/prompt.md)"
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "::notice::opencode exited with code ${EXIT_CODE}"
          exit 0

      - name: Commit agent changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          else
            git commit -q -m "feat: AI-implemented task (${{ github.run_id }})

Triggered by workflow dispatch.
opencode exit code: ${{ steps.agent.outputs.exit_code }}"
            echo "NO_CHANGES=false" >> "$GITHUB_ENV"
            git push -u origin "ai/write/${{ github.run_id }}"
          fi

      - name: Open pull request
        if: env.NO_CHANGES == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "ai/write/${{ github.run_id }}" \
            --title "AI: ${{ inputs.task }}" \
            --body "Automated PR generated by the **AI Agent — Write Code** workflow (workflow dispatch). Requires review." || \
          echo "::notice::PR may already exist for this branch"

      - name: No changes notice
        if: env.NO_CHANGES == 'true'
        run: echo "::notice::The AI agent produced no changes to commit."
